name: Testes de regressão
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        pandas: ['2.2.3', '2.3.2']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt pandas==${{ matrix.pandas }}
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
